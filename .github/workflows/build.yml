name: Build PullOver-X (RootHide arm64e)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The project resolves libroothide from the in-repo roothide-devkit and does
      # no Logos preprocessing, so Theos/ldid are NOT required. Only dpkg-deb is
      # needed to assemble the .deb, and the runner image already provides it.
      # brew is therefore a fallback only, and must never fail the build.
      - name: Ensure dpkg-deb is available
        run: |
          if command -v dpkg-deb >/dev/null 2>&1; then
            echo "dpkg-deb already present: $(command -v dpkg-deb)"
          else
            echo "dpkg-deb missing, trying brew (non-fatal)..."
            brew install dpkg || echo "WARN: brew install dpkg failed"
          fi
          command -v dpkg-deb >/dev/null 2>&1 || echo "WARN: dpkg-deb still missing"

      - name: Install RootHide vendor lib
        run: |
          mkdir -p /opt/theos/vendor/lib/iphone/roothide
          cp -R roothide-devkit/roothide/. /opt/theos/vendor/lib/iphone/roothide/
          ls /opt/theos/vendor/lib/iphone/roothide

      - name: Print toolchain (diagnostic)
        if: always()
        run: |
          echo "=== xcodebuild ==="; xcodebuild -version 2>&1 || echo "xcodebuild missing"
          echo "=== xcode-select ==="; xcode-select -p 2>&1 || true
          echo "=== iphoneos sdk ==="; xcrun --sdk iphoneos --show-sdk-version 2>&1 || echo "no iphoneos sdk"
          echo "=== dpkg-deb ==="; command -v dpkg-deb || echo "dpkg-deb MISSING"
          echo "=== roothide lib (repo) ==="; ls roothide-devkit/roothide 2>&1 | head || true

      - name: Build (RootHide, arm64e)
        run: |
          set -o pipefail
          ./build.sh roothide release 2>&1 | tee build.log

      - name: Show build log (diagnostic)
        if: always()
        run: |
          {
            echo "### 错误摘要（grep）"
            grep -nE "error:|fatal error|BUILD FAILED|The following build commands failed|Command .* failed|not found|not built" build.log 2>/dev/null | head -40 || true
            echo
            echo "### 日志末尾 30 行"
            tail -30 build.log 2>/dev/null || echo "build.log NOT found"
            echo
            echo "### packages/"
            ls -la packages/ 2>/dev/null || echo "packages/ NOT found"
            echo
            echo "### .deb 搜索"
            find . -name '*.deb' -not -path './.git/*' 2>/dev/null || true
          } | tee summary.txt
          echo
          echo "---- 内容已写入 job summary ----"
          cat summary.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PullOver-X-build-log
          path: |
            build.log
            summary.txt

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PullOver-X-roothide-arm64e
          if-no-files-found: warn
          path: |
            packages/*.deb
            *.deb
