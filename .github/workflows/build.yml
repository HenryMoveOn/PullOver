name: Build PullOver-X (RootHide arm64e)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos and dependencies
        run: |
          brew install dpkg ldid
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Install RootHide vendor lib
        run: |
          mkdir -p /opt/theos/vendor/lib/iphone/roothide
          cp -R roothide-devkit/roothide/. /opt/theos/vendor/lib/iphone/roothide/

      - name: Build (RootHide, arm64e)
        run: |
          set -o pipefail
          ./build.sh roothide release 2>&1 | tee build.log

      - name: Show build log (diagnostic)
        if: always()
        run: |
          echo "=== build.log (full) ==="
          cat build.log 2>/dev/null || echo "build.log NOT found"
          echo "=== packages/ dir ==="
          ls -la packages/ 2>/dev/null || echo "packages/ NOT found"
          echo "=== any .deb anywhere in repo ==="
          find . -name '*.deb' -not -path './.git/*' 2>/dev/null || true

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PullOver-X-build-log
          path: build.log

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PullOver-X-roothide-arm64e
          path: packages/*.deb
