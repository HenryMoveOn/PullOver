name: Build PullOver-X (RootHide arm64e)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The Xcode project hardcodes THEOS=/opt/theos and needs two things from it:
      #   -lsubstrate            -> $(THEOS)/vendor/lib/libsubstrate.tbd  (theos/lib repo)
      #   #include <substrate.h> -> $(THEOS)/include/substrate.h          (theos/headers repo)
      # /opt is NOT writable by the runner user, so sudo is mandatory.
      # The earlier red builds were exactly this: git exit 128 (clone into /opt)
      # and exit 1 (mkdir /opt/theos). Everything below is non-fatal and loud.
      - name: Prepare Theos libs + headers (sudo)
        run: |
          set -x
          sudo mkdir -p /opt/theos/vendor/lib /opt/theos/include
          if [ ! -f /opt/theos/vendor/lib/libsubstrate.tbd ]; then
            sudo rm -rf /opt/theos/vendor/lib
            sudo git clone --depth 1 https://github.com/theos/lib.git /opt/theos/vendor/lib \
              || echo "WARN: theos/lib clone failed"
          fi
          for f in substrate.h CydiaSubstrate.h; do
            if [ ! -f "/opt/theos/include/$f" ]; then
              sudo curl -fsSL "https://raw.githubusercontent.com/theos/headers/master/$f" \
                -o "/opt/theos/include/$f" || echo "WARN: fetch $f failed"
            fi
          done
          sudo chown -R "$(whoami)" /opt/theos 2>/dev/null || true
          if [ ! -f /opt/theos/vendor/lib/libsubstrate.tbd ]; then
            echo "!! libsubstrate.tbd missing -> falling back to full Theos clone !!"
            sudo rm -rf /opt/theos
            sudo git clone --depth 1 --recursive https://github.com/theos/theos.git /opt/theos \
              || echo "WARN: theos clone failed"
            sudo chown -R "$(whoami)" /opt/theos 2>/dev/null || true
          fi
          echo "--- vendor/lib ---"; ls /opt/theos/vendor/lib 2>&1 | head -20 || true
          echo "--- include ---"; ls /opt/theos/include 2>&1 || true
          echo "--- libsubstrate.tbd ---"; ls -la /opt/theos/vendor/lib/libsubstrate.tbd 2>&1 || echo "!! libsubstrate.tbd MISSING !!"
          echo "--- substrate.h ---"; ls -la /opt/theos/include/substrate.h 2>&1 || echo "!! substrate.h MISSING !!"

      - name: Install RootHide vendor lib
        run: |
          sudo mkdir -p /opt/theos/vendor/lib/iphone/roothide
          sudo cp -R roothide-devkit/roothide/. /opt/theos/vendor/lib/iphone/roothide/
          sudo chown -R "$(whoami)" /opt/theos/vendor 2>/dev/null || true
          ls /opt/theos/vendor/lib/iphone/roothide 2>&1 || true

      # dpkg-deb is only needed to assemble the .deb; brew is a non-fatal fallback.
      - name: Ensure dpkg-deb is available
        run: |
          if command -v dpkg-deb >/dev/null 2>&1; then
            echo "dpkg-deb present: $(command -v dpkg-deb)"
          else
            echo "dpkg-deb missing, trying brew (non-fatal)..."
            brew install dpkg || echo "WARN: brew install dpkg failed"
          fi
          command -v dpkg-deb >/dev/null 2>&1 || echo "WARN: dpkg-deb still missing"

      - name: Print toolchain (diagnostic)
        if: always()
        run: |
          echo "=== substrate.h ==="; ls -la /opt/theos/include/substrate.h 2>&1 || echo "!! MISSING !!"
          echo "=== libsubstrate.tbd ==="; ls -la /opt/theos/vendor/lib/libsubstrate.tbd 2>&1 || echo "!! MISSING !!"
          echo "=== libroothide.tbd ==="; ls -la /opt/theos/vendor/lib/iphone/roothide/libroothide.tbd 2>&1 || echo "!! MISSING !!"
          echo "=== xcodebuild ==="; xcodebuild -version 2>&1 || echo "xcodebuild missing"
          echo "=== xcode-select ==="; xcode-select -p 2>&1 || true
          echo "=== iphoneos sdk ==="; xcrun --sdk iphoneos --show-sdk-version 2>&1 || echo "no iphoneos sdk"
          echo "=== dpkg-deb ==="; command -v dpkg-deb || echo "dpkg-deb MISSING"

      - name: Build (RootHide, arm64e)
        run: |
          set -o pipefail
          ./build.sh roothide release 2>&1 | tee build.log

      - name: Show build log (diagnostic)
        if: always()
        run: |
          {
            echo "### 错误摘要（grep）"
            grep -nE "error:|fatal error|BUILD FAILED|The following build commands failed|Command .* failed|not found|not built|Permission denied" build.log 2>/dev/null | head -40 || true
            echo
            echo "### 日志末尾 30 行"
            tail -30 build.log 2>/dev/null || echo "build.log NOT found（Build 步骤未执行=前面某步失败）"
            echo
            echo "### packages/"
            ls -la packages/ 2>/dev/null || echo "packages/ NOT found"
            echo
            echo "### .deb 搜索"
            find . -name '*.deb' -not -path './.git/*' 2>/dev/null || true
          } | tee summary.txt
          echo
          cat summary.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PullOver-X-build-log
          path: |
            build.log
            summary.txt

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PullOver-X-roothide-arm64e
          if-no-files-found: warn
          path: |
            packages/*.deb
            *.deb
