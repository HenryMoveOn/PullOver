name: Build PullOver-X (RootHide arm64e)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos and dependencies
        run: |
          brew install dpkg ldid
          # Shallow clone + retry to avoid flaky large recursive-clone failures (git exit 128).
          for i in 1 2 3; do
            rm -rf /opt/theos
            if git clone --depth 1 --recursive --jobs 4 https://github.com/theos/theos.git /opt/theos; then
              echo "theos cloned OK"
              break
            fi
            echo "theos clone attempt $i failed, retrying..."
            sleep 5
          done

      - name: Install RootHide vendor lib
        run: |
          mkdir -p /opt/theos/vendor/lib/iphone/roothide
          cp -R roothide-devkit/roothide/. /opt/theos/vendor/lib/iphone/roothide/

      - name: Print toolchain (diagnostic)
        if: always()
        run: |
          echo "=== xcodebuild ==="; xcodebuild -version 2>&1 || echo "xcodebuild missing"
          echo "=== xcode-select ==="; xcode-select -p 2>&1 || true
          echo "=== iphoneos sdk ==="; xcrun --sdk iphoneos --show-sdk-version 2>&1 || echo "no iphoneos sdk"
          echo "=== theos present? ==="; ls /opt/theos 2>&1 | head || echo "theos MISSING"
          echo "=== roothide lib present? ==="; ls /opt/theos/vendor/lib/iphone/roothide 2>&1 | head || echo "roothide lib MISSING"

      - name: Build (RootHide, arm64e)
        run: |
          set -o pipefail
          set -x
          ./build.sh roothide release 2>&1 | tee build.log

      - name: Show build log (diagnostic)
        if: always()
        run: |
          echo "=== build.log (full) ==="
          cat build.log 2>/dev/null || echo "build.log NOT found"
          echo "=== packages/ dir ==="
          ls -la packages/ 2>/dev/null || echo "packages/ NOT found"
          echo "=== any .deb anywhere in repo ==="
          find . -name '*.deb' -not -path './.git/*' 2>/dev/null || true

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PullOver-X-build-log
          path: build.log

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PullOver-X-roothide-arm64e
          path: packages/*.deb
