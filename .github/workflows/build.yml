name: Build PullOver-X (RootHide arm64e)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and dependencies
        run: |
          brew install dpkg ldid
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Install RootHide vendor lib
        run: |
          mkdir -p /opt/theos/vendor/lib/iphone/roothide
          cp -R roothide-devkit/roothide/. /opt/theos/vendor/lib/iphone/roothide/

      - name: Build (RootHide, arm64e)
        run: ./build.sh roothide release

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: PullOver-X-roothide-arm64e
          path: packages/*.deb
