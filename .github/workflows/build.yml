name: Build PullOver-X (RootHide arm64e)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # RootHide is ElleKit/libhooker based and normally has no "mobilesubstrate"
      # or "preferenceloader" package, so the stock Depends line makes dpkg leave
      # the package un-configured (files land on disk, but the package manager
      # reports it as half-installed). Only "firmware" is always available.
      - name: Relax Debian dependencies for RootHide
        run: |
          set -x
          CONTROL="PullOverX/Package/DEBIAN/control"
          if [ -f "$CONTROL" ]; then
            sed -i.bak -E 's/^Depends:.*/Depends: firmware/' "$CONTROL" || true
            echo "--- control now ---"
            cat "$CONTROL"
          fi

      # The Xcode project hardcodes THEOS=/opt/theos and resolves:
      #   HEADER_SEARCH_PATHS = $(DEVKIT) $(THEOS)/vendor/include $(THEOS)/include
      #   LIBRARY_SEARCH_PATHS = $(POP_SCHEME_LIBRARY_DIR) $(DEVKIT)/roothide $(THEOS)/vendor/lib
      # External pieces it needs (none of them live in the theos main repo):
      #   substrate.h, CydiaSubstrate.h          -> github.com/theos/headers
      #   Preferences/*.h (PSSpecifier.h etc.)    -> github.com/theos/headers  (Preferences/)
      #   libsubstrate.tbd                        -> github.com/theos/lib      (theos vendor/lib)
      # /opt is NOT writable by the runner user -> sudo is mandatory.
      # Everything here is non-fatal and loud; only the actual build can turn the job red.
      - name: Prepare Theos headers + libs (sudo)
        run: |
          set -x
          sudo mkdir -p /opt/theos/vendor/lib /opt/theos/vendor/include /opt/theos/include

          # --- headers: substrate.h + Preferences/*.h ---
          if [ ! -d /opt/theos/headers-src ]; then
            sudo rm -rf /opt/theos/headers-src
            sudo git clone --depth 1 https://github.com/theos/headers.git /opt/theos/headers-src \
              || echo "WARN: theos/headers clone failed"
          fi
          sudo cp /opt/theos/headers-src/*.h /opt/theos/include/ 2>/dev/null || true
          sudo cp -R /opt/theos/headers-src/Preferences /opt/theos/include/ 2>/dev/null || true
          sudo cp -R /opt/theos/headers-src/PreferencesUI /opt/theos/include/ 2>/dev/null || true

          # --- libs: libsubstrate.tbd ---
          if [ ! -f /opt/theos/vendor/lib/libsubstrate.tbd ]; then
            sudo rm -rf /opt/theos/vendor/lib
            sudo git clone --depth 1 https://github.com/theos/lib.git /opt/theos/vendor/lib \
              || echo "WARN: theos/lib clone failed"
          fi

          # --- redundant copies into every search path the project uses ---
          sudo mkdir -p /opt/theos/vendor/lib/iphone/roothide
          sudo cp -R roothide-devkit/roothide/. /opt/theos/vendor/lib/iphone/roothide/ 2>/dev/null || true
          sudo cp /opt/theos/include/substrate.h /opt/theos/include/CydiaSubstrate.h \
            /opt/theos/vendor/include/ 2>/dev/null || true
          sudo cp /opt/theos/include/substrate.h /opt/theos/include/CydiaSubstrate.h \
            roothide-devkit/ 2>/dev/null || true
          sudo cp -R /opt/theos/include/Preferences roothide-devkit/ 2>/dev/null || true
          sudo cp /opt/theos/vendor/lib/libsubstrate.tbd \
            /opt/theos/vendor/lib/iphone/roothide/ 2>/dev/null || true
          sudo cp /opt/theos/vendor/lib/libsubstrate.tbd \
            roothide-devkit/roothide/ 2>/dev/null || true
          sudo chown -R "$(whoami)" /opt/theos 2>/dev/null || true

          echo "=== required headers ==="
          for h in substrate.h CydiaSubstrate.h Preferences/Preferences.h Preferences/PSSpecifier.h \
                   Preferences/PSControlTableCell.h Preferences/PSListController.h Preferences/PSViewController.h; do
            if [ -f "/opt/theos/include/$h" ]; then echo "OK   $h"; else echo "MISS $h"; fi
          done
          echo "=== required libs ==="
          for l in /opt/theos/vendor/lib/libsubstrate.tbd \
                   /opt/theos/vendor/lib/iphone/roothide/libroothide.tbd \
                   roothide-devkit/roothide/libroothide.tbd; do
            if [ -f "$l" ]; then echo "OK   $l"; else echo "MISS $l"; fi
          done

      # dpkg-deb is only needed to assemble the .deb; brew is a non-fatal fallback.
      - name: Ensure dpkg-deb is available
        run: |
          if command -v dpkg-deb >/dev/null 2>&1; then
            echo "dpkg-deb present: $(command -v dpkg-deb)"
          else
            echo "dpkg-deb missing, trying brew (non-fatal)..."
            brew install dpkg || echo "WARN: brew install dpkg failed"
          fi
          command -v dpkg-deb >/dev/null 2>&1 || echo "WARN: dpkg-deb still missing"

      - name: Print toolchain (diagnostic)
        if: always()
        run: |
          echo "=== substrate.h ==="; ls -la /opt/theos/include/substrate.h 2>&1 || echo "!! MISSING !!"
          echo "=== Preferences dir ==="; ls /opt/theos/include/Preferences 2>&1 | head -20 || echo "!! MISSING !!"
          echo "=== libsubstrate.tbd ==="; ls -la /opt/theos/vendor/lib/libsubstrate.tbd 2>&1 || echo "!! MISSING !!"
          echo "=== libroothide.tbd ==="; ls -la /opt/theos/vendor/lib/iphone/roothide/libroothide.tbd 2>&1 || echo "!! MISSING !!"
          echo "=== xcodebuild ==="; xcodebuild -version 2>&1 || echo "xcodebuild missing"
          echo "=== xcode-select ==="; xcode-select -p 2>&1 || true
          echo "=== iphoneos sdk ==="; xcrun --sdk iphoneos --show-sdk-version 2>&1 || echo "no iphoneos sdk"
          echo "=== dpkg-deb ==="; command -v dpkg-deb || echo "dpkg-deb MISSING"

      - name: Build (RootHide, arm64e)
        id: build
        run: |
          set -o pipefail
          ./build.sh roothide release 2>&1 | tee build.log

      # Prints the exact contents of the produced package so the installed
      # files on the device can be compared against it.
      - name: Verify package contents
        if: always()
        run: |
          DEB="$(ls packages/*.deb 2>/dev/null | head -1)"
          if [ -z "$DEB" ]; then
            echo "!! no deb produced !!"
            exit 0
          fi
          echo "=== deb: $DEB ==="
          echo "--- control ---"
          dpkg-deb -I "$DEB" control
          echo "--- file list ---"
          dpkg-deb -c "$DEB" | awk '{print $6}' | grep -v '/$' | sort
          echo "--- runtime library dependencies (otool -L) ---"
          TMP="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$TMP" 2>/dev/null || true
          find "$TMP" -name '*.dylib' -print | while read -r so; do
            echo "=== $so ==="
            otool -L "$so" || true
          done

      # Turn the compile failure into GitHub Annotations (readable via the public
      # API without any authentication) so the exact compiler error is visible
      # in the run's Annotations section and in the job summary.
      - name: Report build errors
        if: always()
        run: |
          {
            echo "### 错误摘要（grep）"
            grep -nE "error:|fatal error|BUILD FAILED|The following build commands failed|Undefined symbols|ld: |clang: |not found" build.log 2>/dev/null | head -40 || true
            echo
            echo "### 日志末尾 40 行"
            tail -40 build.log 2>/dev/null || echo "build.log NOT found（Build 步骤未执行=前面某步失败）"
            echo
            echo "### packages/"
            ls -la packages/ 2>/dev/null || echo "packages/ NOT found"
          } | tee summary.txt || true
          cat summary.txt >> "$GITHUB_STEP_SUMMARY" || true
          # Only raise an annotation when the build actually failed, otherwise a
          # green run would still show a red "error" in the Annotations panel.
          if [ "${{ steps.build.outcome }}" != "failure" ]; then
            echo "build outcome=${{ steps.build.outcome }} - no error annotation raised"
          elif grep -qE "error:|fatal error|Undefined symbols" build.log 2>/dev/null; then
            grep -E "error:|fatal error|Undefined symbols" build.log 2>/dev/null | head -25 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | cut -c1-500)
              echo "::error title=compile error::${safe}"
            done
          else
            safe=$(tail -20 build.log 2>/dev/null | tr '\n' ' ' | sed -e 's/%/%25/g' | cut -c1-900)
            echo "::error title=build tail::${safe}"
          fi

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PullOver-X-build-log
          path: |
            build.log
            summary.txt

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PullOver-X-roothide-arm64e
          if-no-files-found: warn
          path: |
            packages/*.deb
            *.deb
